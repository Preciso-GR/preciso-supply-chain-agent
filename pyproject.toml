[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preciso-supply-chain"
version = "0.1.0"
description = "Hackathon application client powered by the Preciso GraphRAG MCP engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.30,<1",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[project.scripts]
supply-center-api = "preciso_supply_agent.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"preciso_supply_agent.agent" = ["*.md", "prompts/*.md"]
"preciso_supply_agent" = ["resources/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

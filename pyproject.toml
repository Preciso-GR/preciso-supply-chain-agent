[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preciso-supply-chain"
version = "0.1.0"
description = "Hackathon application client powered by the Preciso GraphRAG MCP engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.27,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
